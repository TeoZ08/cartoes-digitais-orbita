<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f3">
  <meta name="description" content="Rafael Martins, consultor de consórcios da Órbita. Contatos e modalidades de atendimento.">
  <title>Rafael Martins | Órbita Consórcios</title>
  <meta property="og:type" content="website">
  <meta property="og:title" content="Rafael Martins | Órbita Consórcios">
  <meta property="og:description" content="Cartão digital de Rafael Martins, consultor de consórcios.">
  <meta property="og:image" content="https://teoz08.github.io/cartoes-digitais-orbita/assets/rafael.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="profile-page theme-essential" data-perfil="rafael">
  <main class="profile-card" aria-labelledby="profile-name">
    <header class="profile-brand">
      <span class="brand"><span class="brand-mark">ó.</span><span>ÓRBITA <small>CONSÓRCIOS</small></span></span>
    </header>
    <div class="essential-avatar">
      <img src="assets/rafael.jpg" alt="Fotografia ilustrativa do consultor" fetchpriority="high">
    </div>
    <section class="profile-identity">
      <p class="role">Consultor de consórcios</p>
      <h1 id="profile-name">Rafael Martins</h1>
      <p class="description">Imóveis, veículos e serviços. Posso ajudar você a conhecer as opções disponíveis.</p>
    </section>
    <div class="actions" aria-label="Ações do cartão">
      <button type="button" class="primary-action" data-action="whatsapp">
        <img src="assets/icons/whatsapp.svg" alt="">
        Conversar pelo WhatsApp
        <span aria-hidden="true">↗</span>
      </button>
      <div class="secondary-actions">
        <button type="button" data-action="vcard"><img src="assets/icons/contact.svg" alt="">Salvar contato</button>
        <button type="button" data-action="share"><img src="assets/icons/share-2.svg" alt="">Compartilhar</button>
      </div>
    </div>
    <p class="microcopy">Para consultar os contatos depois, salve este perfil na sua agenda.</p>
    <footer class="profile-foot">Órbita Consórcios <span>Cartão digital</span></footer>
  </main>
  <div class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
